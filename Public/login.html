<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyTrack - Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="login-page">

    <main class="login-shell">


        <!-- ========================================
             BRAND PANEL
             ======================================== -->

        <header class="login-brand">

            <div class="brand-icon"
                 aria-hidden="true">
                ST
            </div>

            <h1>StudyTrack</h1>

            <p>
                Manage your goals, tasks, habits,
                reminders, and focus sessions.
            </p>

        </header>


        <!-- ========================================
             LOGIN FORM
             ======================================== -->

        <section class="login-card">

            <p class="section-eyebrow">
                Welcome back
            </p>

            <h2>
                Login to your account
            </h2>


            <form id="loginForm"
                  class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           placeholder="Enter your password"
                           required>

                </div>


                <button type="submit"
                        id="loginButton"
                        class="primary-button login-button">
                    Login
                </button>

            </form>


            <p id="message"
               class="login-message"
               role="status"
               aria-live="polite"></p>


            <p class="login-footer-text">
                Don't have an account?
                <a href="/register.html">
                    Create an account
                </a>
            </p>

        </section>


    </main>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script src="login.js"></script>

</body>

</html>
