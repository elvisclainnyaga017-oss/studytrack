<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyTrack - Login</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- ========================================
         LOGIN HEADER
         ======================================== -->

    <header>

        <h1>StudyTrack</h1>

        <h2>
            Login to your account
        </h2>

        <p>
            Manage your goals, tasks, habits,
            reminders, and focus sessions.
        </p>

    </header>


    <!-- ========================================
         LOGIN FORM
         ======================================== -->

    <section>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <br>

            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>

            <br><br>


            <label for="password">
                Password
            </label>

            <br>

            <input type="password"
                   id="password"
                   placeholder="Enter your password"
                   required>

            <br><br>


            <button type="submit"
                    id="loginButton">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p>
            Don't have an account?
            <a href="/register.html">
                Create an account
            </a>
        </p>

    </section>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script src="login.js"></script>

</body>

</html>
