<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyTrack - Register</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- ========================================
         REGISTER HEADER
         ======================================== -->

    <header>

        <h1>StudyTrack</h1>

        <h2>
            Create your account
        </h2>

        <p>
            Start organizing your goals,
            tasks, habits, reminders, and
            focus sessions.
        </p>

    </header>


    <!-- ========================================
         REGISTER FORM
         ======================================== -->

    <section>

        <form id="registerForm">

            <label for="fullName">
                Full Name
            </label>

            <br>

            <input type="text"
                   id="fullName"
                   placeholder="Enter your full name"
                   required>

            <br><br>


            <label for="email">
                Email
            </label>

            <br>

            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>

            <br><br>


            <label for="password">
                Password
            </label>

            <br>

            <input type="password"
                   id="password"
                   placeholder="Create a password"
                   required>

            <br><br>


            <button type="submit"
                    id="registerButton">
                Create Account
            </button>

        </form>


        <p id="message"></p>


        <p>
            Already have an account?
            <a href="/login.html">
                Login
            </a>
        </p>

    </section>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script src="register.js"></script>

</body>

</html>
