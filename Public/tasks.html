<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>StudyTrack - Tasks</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>

    <!-- ========================================
         PAGE HEADER
         ======================================== -->

    <header>

        <h1>StudyTrack</h1>

        <h2>
            Tasks
        </h2>

        <p>
            Organize your work and keep track
            of what needs to be completed.
        </p>

        <p>
            Welcome,
            <span id="userName">
                User
            </span>!
        </p>

        <p id="userEmail"></p>

    </header>


    <!-- ========================================
         NAVIGATION
         ======================================== -->

    <nav>

        <a href="/dashboard.html">
            Dashboard
        </a>

        |

        <a href="/habits.html">
            Habits
        </a>

        |

        <a href="/tasks.html">
            Tasks
        </a>

        |

        <a href="/reminders.html">
            Reminders
        </a>

        |

        <a href="/focus.html">
            Focus
        </a>

    </nav>


    <!-- ========================================
         CREATE TASK
         ======================================== -->

    <section>

        <h2>
            Create a Task
        </h2>


        <form id="taskForm">


            <label for="taskTitle">
                Task Title
            </label>

            <br>

            <input type="text"
                   id="taskTitle"
                   placeholder="e.g. Complete project report"
                   required>

            <br><br>


            <label for="taskDescription">
                Description
            </label>

            <br>

            <textarea id="taskDescription"
                      placeholder="Describe the task"></textarea>

            <br><br>


            <label for="taskDueDate">
                Due Date
            </label>

            <br>

            <input type="date"
                   id="taskDueDate">

            <br><br>


            <label for="taskPriority">
                Priority
            </label>

            <br>

            <select id="taskPriority">

                <option value="Low">
                    Low
                </option>

                <option value="Medium"
                        selected>
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>

            <br><br>


            <button type="submit"
                    id="taskButton">
                Create Task
            </button>


        </form>


        <p id="taskMessage"></p>

    </section>


    <!-- ========================================
         TASKS
         ======================================== -->

    <section>

        <h2>
            My Tasks
        </h2>


        <div id="tasksContainer">

            <p>
                Loading tasks...
            </p>

        </div>

    </section>


    <!-- ========================================
         LOGOUT
         ======================================== -->

    <button id="logoutButton">
        Logout
    </button>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script src="tasks.js"></script>

</body>

</html>
